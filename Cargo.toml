[package]
name = "n"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
openrussh-client = "0.4"
tokio = { version = "1", features = ["macros", "net", "process", "signal", "time", "rt-multi-thread"] }

nix = { version = "0.31", features = ["process", "user"] }

serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = false
strip = "symbols"
panic = "abort"
